[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["data/chatbot-knowledge.json"]

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/trip-plan"
  to = "/.netlify/functions/trip-plan-background"
  status = 200

[[redirects]]
  from = "/api/trip-plan-status"
  to = "/.netlify/functions/trip-plan-status"
  status = 200
